<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 232 232" color="#00b5e2" role="img" aria-label="Esempi di foto non corrette: sfocata, volto coperto, più persone, troppo lontana" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3.2"/></filter>
    <clipPath id="tile"><rect width="112" height="112" rx="10"/></clipPath>
    <g id="p">
      <path d="M-38 62 Q-38 22 0 18 Q38 22 38 62Z" fill="currentColor"/>
      <rect x="-6" y="12" width="12" height="12" rx="4" fill="#e8b88f"/>
      <ellipse cy="-4" rx="17" ry="20" fill="#f1c9a5"/>
      <path d="M-17 -6 Q-18 -26 0 -26 Q18 -26 17 -6 Q12 -17 0 -17 Q-12 -17 -17 -6Z" fill="#4a3a2e"/>
      <circle cx="-6" cy="-3" r="1.6" fill="#3b2f2a"/>
      <circle cx="6" cy="-3" r="1.6" fill="#3b2f2a"/>
      <path d="M-5 7 Q0 11 5 7" fill="none" stroke="#b5654f" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <g id="x">
      <circle r="9" fill="#c26a6a"/>
      <path d="M-3.5 -3.5 L3.5 3.5 M3.5 -3.5 L-3.5 3.5" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- Sfocata -->
  <g clip-path="url(#tile)">
    <rect width="112" height="112" fill="#e6eef6"/>
    <use href="#p" x="56" y="42" filter="url(#blur)"/>
    <rect y="92" width="112" height="20" fill="#f6e3e3"/>
    <text x="56" y="106" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="600" fill="#9b4a4a">Sfocata</text>
    <use href="#x" x="98" y="14"/>
  </g>

  <!-- Volto coperto -->
  <g transform="translate(120 0)" clip-path="url(#tile)">
    <rect width="112" height="112" fill="#e6eef6"/>
    <use href="#p" x="56" y="42"/>
    <rect x="38" y="44" width="36" height="17" rx="7" fill="#c9d3df"/>
    <rect y="92" width="112" height="20" fill="#f6e3e3"/>
    <text x="56" y="106" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="600" fill="#9b4a4a">Volto coperto</text>
    <use href="#x" x="98" y="14"/>
  </g>

  <!-- Più persone -->
  <g transform="translate(0 120)" clip-path="url(#tile)">
    <rect width="112" height="112" fill="#e6eef6"/>
    <use href="#p" color="#f2a65a" transform="translate(32 48) scale(.78)"/>
    <use href="#p" color="#7aa7d9" transform="translate(82 48) scale(.78)"/>
    <use href="#p" transform="translate(57 42) scale(.9)"/>
    <rect y="92" width="112" height="20" fill="#f6e3e3"/>
    <text x="56" y="106" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="600" fill="#9b4a4a">Più persone</text>
    <use href="#x" x="98" y="14"/>
  </g>

  <!-- Troppo lontana -->
  <g transform="translate(120 120)" clip-path="url(#tile)">
    <rect width="112" height="112" fill="#e6eef6"/>
    <rect y="74" width="112" height="18" fill="#d5e0ec"/>
    <use href="#p" transform="translate(56 58) scale(.36)"/>
    <rect y="92" width="112" height="20" fill="#f6e3e3"/>
    <text x="56" y="106" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="600" fill="#9b4a4a">Troppo lontana</text>
    <use href="#x" x="98" y="14"/>
  </g>
</svg>
