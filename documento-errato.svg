<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 232 232" role="img" aria-label="Esempi di documenti non corretti: scaduto, sfocato, dati illeggibili, tagliato" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.6"/></filter>
    <clipPath id="tile"><rect width="112" height="112" rx="10"/></clipPath>
    <g id="c">
      <rect width="96" height="60" rx="6" fill="#fff" stroke="#b8c7d9"/>
      <path d="M0 6 Q0 0 6 0 H90 Q96 0 96 6 V12 H0Z" fill="#00b5e2"/>
      <rect x="7" y="19" width="24" height="32" rx="3" fill="#dbe3ec"/>
      <circle cx="19" cy="30" r="6" fill="#f1c9a5"/>
      <path d="M10 51 Q10 40 19 39 Q28 40 28 51Z" fill="#00b5e2"/>
      <rect x="38" y="20" width="48" height="4" rx="2" fill="#9fb0c6"/>
      <rect x="38" y="29" width="40" height="4" rx="2" fill="#9fb0c6"/>
      <rect x="38" y="38" width="44" height="4" rx="2" fill="#9fb0c6"/>
      <rect x="38" y="47" width="30" height="4" rx="2" fill="#9fb0c6"/>
    </g>
    <g id="x">
      <circle r="9" fill="#c26a6a"/>
      <path d="M-3.5 -3.5 L3.5 3.5 M3.5 -3.5 L-3.5 3.5" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- Scaduto -->
  <g clip-path="url(#tile)">
    <rect width="112" height="112" fill="#e6eef6"/>
    <use href="#c" x="8" y="18"/>
    <g transform="translate(56 48) rotate(-16)">
      <rect x="-34" y="-9" width="68" height="18" rx="3" fill="#fff" fill-opacity=".85" stroke="#b05555" stroke-width="2"/>
      <text y="4.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#b05555">SCADUTO</text>
    </g>
    <rect y="92" width="112" height="20" fill="#f6e3e3"/>
    <text x="56" y="106" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="600" fill="#9b4a4a">Scaduto</text>
    <use href="#x" x="98" y="14"/>
  </g>

  <!-- Sfocato -->
  <g transform="translate(120 0)" clip-path="url(#tile)">
    <rect width="112" height="112" fill="#e6eef6"/>
    <use href="#c" x="8" y="18" filter="url(#blur)"/>
    <rect y="92" width="112" height="20" fill="#f6e3e3"/>
    <text x="56" y="106" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="600" fill="#9b4a4a">Sfocato</text>
    <use href="#x" x="98" y="14"/>
  </g>

  <!-- Dati illeggibili (riflesso) -->
  <g transform="translate(0 120)" clip-path="url(#tile)">
    <rect width="112" height="112" fill="#e6eef6"/>
    <use href="#c" x="8" y="18"/>
    <ellipse cx="62" cy="44" rx="30" ry="15" fill="#fff" fill-opacity=".92" filter="url(#blur)"/>
    <rect y="92" width="112" height="20" fill="#f6e3e3"/>
    <text x="56" y="106" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="600" fill="#9b4a4a">Dati illeggibili</text>
    <use href="#x" x="98" y="14"/>
  </g>

  <!-- Tagliato -->
  <g transform="translate(120 120)" clip-path="url(#tile)">
    <rect width="112" height="112" fill="#e6eef6"/>
    <use href="#c" x="40" y="18"/>
    <rect y="92" width="112" height="20" fill="#f6e3e3"/>
    <text x="56" y="106" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="600" fill="#9b4a4a">Tagliato</text>
    <use href="#x" x="98" y="14"/>
  </g>
</svg>
